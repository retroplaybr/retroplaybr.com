<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RetroPlayBR</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>RETROPLAYBR</h1><button id="adminBtn">⚙ Admin</button></header>
  <main><section class="hero"><p>Seu catálogo retrô</p><h2>Jogos clássicos em um só lugar</h2></section><div id="catalog" class="grid"></div></main>
  <div id="modal" class="modal hidden"><div class="panel"><button class="close" id="close">×</button><div id="login"><h2>Painel de Admin</h2><p>Digite a senha para gerenciar os jogos.</p><input id="password" type="password" placeholder="Senha"><button id="loginBtn">Entrar</button><small id="error"></small></div><div id="dashboard" class="hidden"><h2>Adicionar jogo</h2><form id="gameForm"><input id="name" placeholder="Nome do jogo" required><input id="platform" placeholder="Plataforma (ex.: SNES)" required><input id="cover" type="url" placeholder="URL da capa" required><input id="link" type="url" placeholder="Link do Terabox" required><button type="submit">Adicionar jogo</button></form><div id="adminList"></div><button id="logout" class="secondary">Sair</button></div></div></div>
  <script src="app.js"></script>
</body></html>
