<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RetroHub</title><style>
:root{--bg:#06111f;--text:#edf7ff;--muted:#91a3b7;--accent:#42c6ff;--shadow:0 22px 60px rgba(0,0,0,.42)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#173553,#06111f 42%,#02070d);color:var(--text);overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:24px 4vw 24px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.15em;text-transform:uppercase;display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:2px solid var(--accent);border-radius:9px;display:grid;place-items:center}.status{color:#91a3b7;font-size:12px}main{display:grid;grid-template-columns:42% 58%;min-height:0}.hero{align-self:center;padding:0 2vw 0 3vw}.eyebrow{color:#62d8ff;text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:.18em}.title{font-size:clamp(58px,7vw,105px);line-height:.9;margin:14px 0 20px}.desc{max-width:560px;color:#c8d7e5;font-size:18px;line-height:1.45}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.pill{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 11px;font-size:11px;color:#d4e2ef}.systems-wrap{align-self:center;min-width:0;position:relative}.systems{display:flex;align-items:center;gap:18px;overflow-x:auto;padding:45px 7vw 55px 2vw;scrollbar-width:none}.systems::-webkit-scrollbar{display:none}.card{flex:0 0 205px;height:315px;border-radius:23px;background:linear-gradient(160deg,rgba(31,55,79,.8),rgba(12,25,39,.85));border:1px solid rgba(255,255,255,.08);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#91a3b7;transition:.22s;cursor:pointer}.card.active{transform:scale(1.08);color:#f5fbff;border-color:rgba(98,216,255,.65);box-shadow:0 0 0 1px rgba(66,198,255,.11),0 0 48px rgba(66,198,255,.16)}.console-icon{height:58%;display:grid;place-items:center}.console-icon svg{width:76%;height:76%}.console-name strong{display:block;font-size:25px}.console-name span{font-size:11px;text-transform:uppercase;letter-spacing:.12em}.hint{position:absolute;right:6vw;top:12px;color:#7f92a6;font-size:12px}footer{display:flex;justify-content:space-between;color:#8093a9;font-size:12px}.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,20px);background:#07121f;border:1px solid rgba(124,231,255,.35);box-shadow:var(--shadow);padding:13px 18px;border-radius:12px;opacity:0;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.touchbar{display:none;position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;gap:10px}.touchbtn{width:54px;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(8,24,40,.92);color:white;font-size:22px}.touchbtn.primary{width:74px;background:rgba(66,198,255,.22);font-size:14px;font-weight:800}.touchbtn.back{width:64px;font-size:13px}@media(pointer:coarse),(max-width:860px){.touchbar{display:flex}.app{padding:18px 16px 88px}.status{display:none}main{grid-template-columns:1fr}.hero{padding:3vh 4vw 0}.title{font-size:56px}.desc{font-size:15px}.systems{padding:25px 14vw 35px}.card{flex-basis:190px}footer,.hint{display:none}}
</style></head><body><div class="app"><header><div class="brand"><div class="mark">R</div> RetroHub</div><div class="status">CATÁLOGO ONLINE • <a href="admin.html" style="color:#91a3b7;text-decoration:none">ADMIN</a></div></header><main><section class="hero"><div class="eyebrow">Sistema selecionado</div><h1 class="title" id="heroTitle">SNES</h1><div class="desc" id="heroDesc"></div><div class="meta"><span class="pill" id="generation"></span><span class="pill">Catálogo público</span><span class="pill">Touch</span></div></section><section class="systems-wrap"><div class="hint">← → navegar • Enter abrir</div><div class="systems" id="systems"></div></section></main><footer><div>← → Navegar • Enter Abrir • Esc Voltar</div><div>Use apenas jogos/ROMs que você tenha direito de utilizar.</div></footer></div><div class="toast" id="toast"></div><div class="touchbar"><button class="touchbtn" id="touchLeft">◀</button><button class="touchbtn primary" id="touchOpen">ABRIR</button><button class="touchbtn" id="touchRight">▶</button><button class="touchbtn back" id="touchBack">VOLTAR</button></div><script>
const data=[{name:'SNES',sub:'Super Nintendo',gen:'16-bit',desc:'Super Nintendo Entertainment System.',icon:'gamepad'},{name:'NES',sub:'Nintendo Entertainment System',gen:'8-bit',desc:'Clássicos do Nintendo Entertainment System.',icon:'gamepad'},{name:'Nintendo 3DS',sub:'3DS',gen:'Portátil 3D',desc:'Biblioteca de Nintendo 3DS.',icon:'dual'},{name:'Nintendo DS',sub:'DS',gen:'Dual Screen',desc:'Jogos de Nintendo DS.',icon:'dual'},{name:'Nintendo 64',sub:'N64',gen:'64-bit',desc:'Biblioteca Nintendo 64.',icon:'gamepad'},{name:'Game Boy Advance',sub:'GBA',gen:'32-bit portátil',desc:'Biblioteca de Game Boy Advance.',icon:'handheld'},{name:'Game Boy',sub:'GB',gen:'8-bit portátil',desc:'Clássicos do Game Boy.',icon:'handheld'},{name:'Game Boy Color',sub:'GBC',gen:'Color portátil',desc:'Biblioteca de Game Boy Color.',icon:'handheld'},{name:'GameCube',sub:'Nintendo GameCube',gen:'128-bit era',desc:'Biblioteca GameCube.',icon:'cube'}];let selected=0,publicGames=[];
const systems=document.getElementById('systems');function icon(type){const c='fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';if(type==='dual')return `<svg viewBox="0 0 180 180" ${c}><rect x="37" y="18" width="106" height="144" rx="14"/><rect x="53" y="36" width="74" height="44" rx="5"/><rect x="53" y="96" width="74" height="44" rx="5"/></svg>`;if(type==='handheld')return `<svg viewBox="0 0 180 180" ${c}><rect x="43" y="18" width="94" height="144" rx="22"/><rect x="57" y="35" width="66" height="56" rx="6"/><path d="M62 118h24M74 106v24"/><circle cx="112" cy="116" r="7"/><circle cx="126" cy="129" r="7"/></svg>`;if(type==='cube')return `<svg viewBox="0 0 180 180" ${c}><path d="M90 20l57 31v68l-57 41-57-41V51z"/><path d="M33 51l57 34 57-34M90 85v75"/></svg>`;return `<svg viewBox="0 0 180 180" ${c}><path d="M42 72c-18 6-28 24-24 43l7 31c3 13 20 17 29 7l21-25h30l21 25c9 10 26 6 29-7l7-31c4-19-6-37-24-43l-28-9H70z"/><circle cx="122" cy="98" r="8"/><circle cx="140" cy="112" r="8"/><path d="M48 103h27M61.5 89.5v27"/></svg>`}
function render(){systems.innerHTML='';data.forEach((x,i)=>{const el=document.createElement('article');el.className='card'+(i===selected?' active':'');el.innerHTML=`<div class="console-icon">${icon(x.icon)}</div><div class="console-name"><span>${x.sub}</span><strong>${x.name}</strong></div>`;el.onclick=()=>{selected=i;render();openSystem()};systems.appendChild(el)});const d=data[selected];heroTitle.textContent=d.name;heroDesc.textContent=d.desc;generation.textContent=d.gen;requestAnimationFrame(()=>systems.children[selected]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))}
async function loadPublic(){try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw 0;publicGames=(await r.json()).games||[]}catch{publicGames=[]}}
function openSystem(){const sys=data[selected].name,games=publicGames.filter(g=>g.system===sys);if(!games.length){toast.textContent=`${sys}: nenhum jogo público cadastrado ainda.`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900);return}document.querySelector('main').innerHTML=`<section style="grid-column:1/-1;overflow:auto;padding:3vh 4vw"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">Biblioteca pública</div><h1 style="font-size:clamp(34px,5vw,70px);margin:8px 0 18px">${sys}</h1></div><button onclick="location.reload()" style="background:#14283b;color:white;border:1px solid #38506a;border-radius:10px;padding:10px 14px">Voltar</button></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px">${games.map(g=>`<article onclick="location.href='player.html?scope=public&id=${encodeURIComponent(g.id)}'" style="cursor:pointer;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);border-radius:16px;overflow:hidden"><div style="aspect-ratio:3/4;background:#13283d"><img src="${g.cover||''}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"></div><div style="padding:12px"><strong>${g.name}</strong><div style="font-size:11px;color:#91a3b7;margin-top:4px">🌐 ${g.system}</div></div></article>`).join('')}</div></section>`}
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){selected=(selected+1)%data.length;render()}if(e.key==='ArrowLeft'){selected=(selected-1+data.length)%data.length;render()}if(e.key==='Enter')openSystem();if(e.key==='Escape')location.reload()});touchLeft.onclick=()=>{selected=(selected-1+data.length)%data.length;render()};touchRight.onclick=()=>{selected=(selected+1)%data.length;render()};touchOpen.onclick=openSystem;touchBack.onclick=()=>location.reload();(async()=>{await loadPublic();render()})();
</script></body></html>
