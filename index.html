<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha TV Retro</title>
    <style>
        body { background-color: #141414; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #e50914; margin-bottom: 30px; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #222; border: 2px solid transparent; border-radius: 8px; padding: 15px; width: 180px; cursor: pointer; transition: 0.2s; }
        .card:focus, .card:hover { border-color: #e50914; background: #333; transform: scale(1.05); outline: none; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .card p { margin-top: 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🎮 Meus Jogos Retrô</h1>

    <div class="grid">
        <!-- Exemplo de Jogo 1 (Super Nintendo) -->
        <div class="card" tabindex="0" onclick="jogar('snes', 'roms/super_mario.smc')">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=150&auto=format&fit=crop" alt="Capa">
            <p>Super Mario World</p>
        </div>

        <!-- Exemplo de Jogo 2 (Mega Drive) -->
        <div class="card" tabindex="0" onclick="jogar('megaDrive', 'roms/sonic.bin')">
            <img src="https://images.unsplash.com/photo-1531525645387-7f14be1bdbbd?w=150&auto=format&fit=crop" alt="Capa">
            <p>Sonic The Hedgehog</p>
        </div>
    </div>

    <script>
        function jogar(consoleTipo, romPath) {
            window.location.href = `jogar.html?core=${consoleTipo}&rom=${encodeURIComponent(romPath)}`;
        }

        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            const cards = Array.from(document.querySelectorAll('.card'));
            let index = cards.indexOf(active);

            if (e.key === 'ArrowRight' && index < cards.length - 1) cards[index + 1].focus();
            if (e.key === 'ArrowLeft' && index > 0) cards[index - 1].focus();
            if (e.key === 'Enter' && index !== -1) cards[index].click();
        });

        if(document.querySelector('.card')) document.querySelector('.card').focus();
    </script>
</body>
</html>
