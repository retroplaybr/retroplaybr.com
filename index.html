<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RetroPlayBR - Estilo RetroBat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0b0d;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .header {
            height: 10vh;
            display: flex;
            align-content: center;
            justify-content: space-between;
            padding: 20px 50px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }
        .logo { font-size: 28px; font-weight: bold; color: #ff0043; text-transform: uppercase; letter-spacing: 2px; }
        .sistema-nome { font-size: 24px; color: #aaaaaa; }

        .conteudo {
            height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .carrossel {
            display: flex;
            transition: transform 0.3s ease-in-out;
            padding: 0 40vw;
        }

        .card-plataforma {
            background: #16161a;
            border: 4px solid #24242b;
            border-radius: 12px;
            width: 280px;
            height: 380px;
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.25s ease;
            opacity: 0.5;
        }

        .card-plataforma.focado {
            border-color: #ff0043;
            box-shadow: 0 0 30px rgba(255, 0, 67, 0.4);
            transform: scale(1.15);
            opacity: 1;
            background: #1f1f27;
        }

        .card-plataforma .icone { font-size: 60px; margin-bottom: 20px; }
        .card-plataforma h2 { margin: 10px 0; font-size: 24px; }
        .card-plataforma .contador { color: #888; font-size: 14px; }

        .footer {
            height: 15vh;
            background: #141419;
            display: flex;
            align-items: center;
            padding: 0 50px;
            font-size: 16px;
            color: #ccc;
            border-top: 2px solid #222;
        }
        .btn-guia { background: #333; padding: 5px 12px; border-radius: 6px; margin-right: 10px; color: #fff; font-weight: bold; }
        .btn-guia.confirmar { background: #ff0043; }

        #iframe-emulador {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            border: none; z-index: 9999; background: #000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">RetroPlayBR</div>
        <div class="sistema-nome" id="nome-sistema-atual">Super Nintendo</div>
    </div>

    <div class="conteudo">
        <div class="carrossel" id="carrossel-consoles"></div>
    </div>

    <div class="footer">
        <span class="btn-guia">⬅️ ➡️</span> Navegar 
        <span style="margin-left: 30px;"></span>
        <span class="btn-guia confirmar">OK / Enter</span> Abrir Plataforma
        <span style="margin-left: 30px;"></span>
        <span class="btn-guia">Back / Voltar</span> Sair do Jogo
    </div>

    <iframe id="iframe-emulador"></iframe>

<script>
    var listaConsoles = [
        { id: "snes", nome: "Super Nintendo", icone: "🕹️", total: "0 Jogos" },
        { id: "gba", nome: "Game Boy Advance", icone: "🎮", total: "0 Jogos" },
        { id: "mega", nome: "Mega Drive", icone: "👾", total: "0 Jogos" },
        { id: "nes", nome: "Nintendo (NES)", icone: "📺", total: "0 Jogos" }
    ];

    var indexFocado = 0;
    var emuladorAberto = false;
    var carrossel = document.getElementById("carrossel-consoles");

    function renderizarMenu() {
        var html = "";
        for (var i = 0; i < listaConsoles.length; i++) {
            var c = listaConsoles[i];
            var classeFocado = (i === indexFocado) ? "focado" : "";
            html += '<div class="card-plataforma ' + classeFocado + '" id="console-' + i + '">' +
                        '<div class="icone">' + c.icone + '</div>' +
                        '<h2>' + c.nome + '</h2>' +
                        '<div class="contador">' + c.total + '</div>' +
                    '</div>';
        }
        carrossel.innerHTML = html;
        atualizarPosicao();
    }

    function atualizarPosicao() {
        var cards = document.querySelectorAll(".card-plataforma");
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove("focado");
        }
        
        var cardFocado = document.getElementById("console-" + indexFocado);
        if (cardFocado) {
            cardFocado.classList.add("focado");
            document.getElementById("nome-sistema-atual").innerText = listaConsoles[indexFocado].nome;
        }

        var deslocamento = -(indexFocado * 320);
        carrossel.style.transform = "translateX(" + deslocamento + "px)";
    }

    document.addEventListener("keydown", function(e) {
        if (emuladorAberto) {
            if (e.keyCode === 461 || e.key === "Backspace") {
                fecharEmulador();
            }
            return; 
        }

        if (e.keyCode === 39) {
            if (indexFocado < listaConsoles.length - 1) {
                indexFocado++;
                atualizarPosicao();
            }
        } else if (e.keyCode === 37) {
            if (indexFocado > 0) {
                indexFocado--;
                atualizarPosicao();
            }
        } else if (e.keyCode === 13) {
            solicitarAberturaJogo();
        }
    });

    function solicitarAberturaJogo() {
        alert("Modifique este arquivo para injetar suas ROMs da plataforma: " + listaConsoles[indexFocado].nome);
    }

    function fecharEmulador() {
        var iframe = document.getElementById("iframe-emulador");
        iframe.src = "";
        iframe.style.display = "none";
        emuladorAberto = false;
    }

    renderizarMenu();
</script>
</body>
</html>
