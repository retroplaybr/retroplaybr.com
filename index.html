h1{margin:0;font-size:28px}p{color:#9fb0c7}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
a{color:#fff;text-decoration:none;background:#1677ff;padding:11px 16px;border-radius:10px}
.filters{display:flex;gap:8px;overflow:auto;padding:14px 0 2px}.filter{white-space:nowrap;border:1px solid #31435d;background:#101e31;color:#fff;padding:9px 12px;border-radius:999px}
main{padding:24px 5% 60px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{min-height:145px;text-align:left;padding:18px;border:1px solid #263a55;border-radius:16px;background:linear-gradient(145deg,#10233a,#091522);color:#fff;cursor:pointer}
.card:hover{transform:translateY(-2px);border-color:#55a7ff}.card strong{display:block;font-size:18px;margin:22px 0 7px}.card small{color:#7e94ae}
.badge{font-size:11px;background:#1d3553;padding:5px 8px;border-radius:8px;color:#bcd7f5}
#notice{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111d2d;border:1px solid #37506f;padding:14px 18px;border-radius:12px;display:none;max-width:90%}
