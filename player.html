<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RetroHub Player</title>
<style>
html,body{height:100%;margin:0;background:#02060b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}body{display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#07111d;border-bottom:1px solid rgba(255,255,255,.1)}.brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase}.brand b{color:#42c6ff}.actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid rgba(255,255,255,.15);background:#14283b;color:white;border-radius:9px;padding:8px 12px;text-decoration:none;cursor:pointer}.stage{min-height:0;display:grid;place-items:center;position:relative}.frame{width:100%;height:100%;min-height:0}#game{width:100%;height:100%}.message{max-width:720px;padding:24px;text-align:center;line-height:1.5}.message h1{margin-top:0}.message p{color:#aab9c8}.warn{color:#ffd37b!important}.small{font-size:12px;color:#8da0b3}.hidden{display:none}@media (pointer:coarse),(max-width:900px){body{grid-template-rows:auto 1fr}.top{padding:8px 10px}.brand{font-size:13px}.btn{padding:8px 10px}.frame{touch-action:none}.small{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style>
</head>
<body>
<div class="top"><div class="brand"><b>Retro</b>Hub Player</div><div class="actions"><span id="gameTitle" class="small"></span><a class="btn" href="index.html">Voltar</a></div></div>
<div class="stage" id="stage"><div class="frame"><div id="game"></div></div></div>
<script>
const params=new URLSearchParams(location.search), id=params.get('id');
const systemMap={'SNES':'snes','NES':'nes','Nintendo 3DS':'3ds','Nintendo DS':'nds','Nintendo 64':'n64','Game Boy Advance':'gba','Game Boy':'gb','Game Boy Color':'gb'};
function fail(title,text,extra=''){document.getElementById('stage').innerHTML=`<div class="message"><h1>${title}</h1><p>${text}</p>${extra?`<p class="warn">${extra}</p>`:''}<p><a class="btn" href="admin.html">Abrir painel Admin</a> <a class="btn" href="index.html">Voltar ao menu</a></p></div>`}
async function boot(){
 const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw new Error('Não foi possível carregar o catálogo.');const d=await r.json();const game=(d.games||[]).find(g=>String(g.id)===String(id));
 if(!game)return fail('Jogo não encontrado','Esse jogo não existe no catálogo online.');
 if(game.system==='GameCube')return fail('GameCube ainda não está ativo neste player','O player atual não possui um core GameCube integrado.');
 const core=systemMap[game.system]; if(!core)return fail('Console não configurado',`Ainda não há um core definido para ${game.system}.`);
 if(!game.rom)return fail('ROM não configurada','O arquivo online deste jogo não foi encontrado.');
 document.getElementById('gameTitle').textContent=game.name+' • '+game.system;
 const schemeMap={snes:'snes',nes:'nes',nds:'nds',n64:'n64',gba:'gba',gb:'gb'};
 window.EJS_player='#game';window.EJS_core=core;window.EJS_gameUrl=game.rom;window.EJS_gameName=game.name;window.EJS_gameID=game.id||1;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;window.EJS_fullscreenOnLoaded=false;window.EJS_language='pt-BR';window.EJS_color='#42c6ff';window.EJS_controlScheme=schemeMap[core]||core;window.EJS_noAutoFocus=false;if(core==='3ds')window.EJS_threads=true;
 const sc=document.createElement('script');sc.src='https://cdn.emulatorjs.org/stable/data/loader.js';sc.onerror=()=>fail('Não foi possível carregar o emulador','Verifique a conexão com a internet.');document.body.appendChild(sc)
}
boot().catch(e=>fail('Erro ao abrir o jogo',e.message||String(e)));
</script>
</body>
</html>
