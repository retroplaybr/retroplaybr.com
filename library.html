<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:white;font-family:Segoe UI,Arial,sans-serif}header{height:90px;border-bottom:1px solid #1b2330;padding:20px 36px;display:flex;justify-content:space-between;align-items:center}h1{margin:0}small{color:#8290a4}main{padding:38px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}.game{height:290px;border:1px solid #2c3748;border-radius:20px;background:linear-gradient(145deg,#15202d,#0c1118);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;outline:none;cursor:pointer}.game:focus,.game:hover{border-color:#8699b7;transform:translateY(-4px)}.cover{flex:1;display:grid;place-items:center;font-size:55px}.game h2{margin:0 0 6px}.game p{margin:0;color:#8592a6;font-size:12px}footer{padding:20px 38px;color:#7f8c9f;font-size:12px}
</style></head><body><header><div><h1 id="title"></h1><small id="sub"></small></div><div><small>ESC / B — voltar</small></div></header><main><div class="grid" id="grid"></div></main><footer>Setas para navegar • Enter/A para abrir</footer>
<script>
const systems=[{"id": "nes", "name": "Nintendinho", "core": "nes", "emoji": "NES", "ext": ".nes"}, {"id": "snes", "name": "Super Nintendo", "core": "snes", "emoji": "SNES", "ext": ".sfc / .smc"}, {"id": "n64", "name": "Nintendo 64", "core": "n64", "emoji": "N64", "ext": ".z64 / .n64 / .v64"}, {"id": "nds", "name": "Nintendo DS", "core": "nds", "emoji": "DS", "ext": ".nds"}, {"id": "3ds", "name": "Nintendo 3DS", "core": "3ds", "emoji": "3DS", "ext": ".cci / .3ds / .cxi"}, {"id": "segaMD", "name": "Mega Drive", "core": "segaMD", "emoji": "MD", "ext": ".bin / .md / .gen"}, {"id": "psx", "name": "PlayStation", "core": "psx", "emoji": "PS1", "ext": ".bin/.cue / .iso / .pbp"}, {"id": "psp", "name": "PSP", "core": "psp", "emoji": "PSP", "ext": ".iso / .cso / .pbp"}];const q=new URLSearchParams(location.search),id=q.get('system')||'snes',sys=systems.find(s=>s.id===id)||systems[1];document.getElementById('title').textContent=sys.name;document.getElementById('sub').textContent='Biblioteca de jogos';
let games=[];
if(id==='snes')games.push({name:'Super Mario World',desc:'Super Nintendo',rom:'roms/snes/Super Mario World (USA).sfc'});
if(id==='3ds')games.push({name:'Super Mario 3D Land',desc:'Nintendo 3DS',rom:'roms/3ds/Super Mario 3D Land (USA) (En,Fr,Es) (Rev 1).cci'});
games.push({name:'Carregar minha ROM',desc:'Adicionar arquivo local',upload:true});
const grid=document.getElementById('grid');games.forEach((g,i)=>{const d=document.createElement('div');d.tabIndex=0;d.className='game';d.innerHTML=`<div class="cover">${g.upload?'＋':'🎮'}</div><h2>${g.name}</h2><p>${g.desc}</p>`;d.onclick=()=>openGame(g);grid.appendChild(d)});
function openGame(g){if(g.upload)location.href='emulator.html?system='+encodeURIComponent(sys.id)+'&upload=1';else location.href='emulator.html?system='+encodeURIComponent(sys.id)+'&name='+encodeURIComponent(g.name)+'&rom='+encodeURIComponent(g.rom)}
let f=0;function setF(){[...grid.children][f]?.focus()};addEventListener('keydown',e=>{if(e.key==='ArrowRight'){f=Math.min(games.length-1,f+1);setF()}if(e.key==='ArrowLeft'){f=Math.max(0,f-1);setF()}if(e.key==='Enter')openGame(games[f]);if(e.key==='Escape')location.href='index.html'});setF();
</script>
<script src="assets/gamepad-webos.js"></script>
</body></html>
