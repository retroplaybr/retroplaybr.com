<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emulador</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030405;color:white;font-family:Segoe UI,Arial,sans-serif}body{display:flex;flex-direction:column}.bar{height:66px;padding:0 22px;border-bottom:1px solid #1e2733;display:flex;align-items:center;justify-content:space-between}.wrap{flex:1;padding:16px;display:grid;place-items:center}#game{width:min(1200px,100%);height:min(760px,100%);background:black;border:1px solid #2b3647;border-radius:18px;overflow:hidden}.picker{position:fixed;inset:66px 0 0;display:grid;place-items:center;background:#070a0f}button,label{padding:14px 18px;border-radius:10px;background:white;color:black;font-weight:800;border:0;cursor:pointer}</style></head><body><div class="bar"><div><b id="name">Emulador</b><div id="sys" style="color:#8190a4;font-size:12px"></div></div><div style="color:#8190a4;font-size:12px">ESC — voltar</div></div><div class="wrap"><div id="game"></div></div><div class="picker" id="picker" style="display:none"><div style="text-align:center"><h2>Escolha sua ROM</h2><label>Selecionar arquivo<input id="file" type="file" hidden></label></div></div>
<script>
const systems=[{"id": "nes", "name": "Nintendinho", "core": "nes", "emoji": "NES", "ext": ".nes"}, {"id": "snes", "name": "Super Nintendo", "core": "snes", "emoji": "SNES", "ext": ".sfc / .smc"}, {"id": "n64", "name": "Nintendo 64", "core": "n64", "emoji": "N64", "ext": ".z64 / .n64 / .v64"}, {"id": "nds", "name": "Nintendo DS", "core": "nds", "emoji": "DS", "ext": ".nds"}, {"id": "3ds", "name": "Nintendo 3DS", "core": "3ds", "emoji": "3DS", "ext": ".cci / .3ds / .cxi"}, {"id": "segaMD", "name": "Mega Drive", "core": "segaMD", "emoji": "MD", "ext": ".bin / .md / .gen"}, {"id": "psx", "name": "PlayStation", "core": "psx", "emoji": "PS1", "ext": ".bin/.cue / .iso / .pbp"}, {"id": "psp", "name": "PSP", "core": "psp", "emoji": "PSP", "ext": ".iso / .cso / .pbp"}];const q=new URLSearchParams(location.search),sys=systems.find(s=>s.id===(q.get('system')||'snes'))||systems[1];document.getElementById('sys').textContent=sys.name;
function launch(url,name){document.getElementById('picker').style.display='none';document.getElementById('name').textContent=name||sys.name;window.EJS_player='#game';window.EJS_core=sys.core;window.EJS_gameName=name||'Jogo';window.EJS_gameUrl=url;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_language='pt-BR';window.EJS_startOnLoaded=true;const s=document.createElement('script');s.src='https://cdn.emulatorjs.org/stable/data/loader.js';document.body.appendChild(s)}
if(q.get('upload')==='1'){document.getElementById('picker').style.display='grid';document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)launch(URL.createObjectURL(f),f.name)})}else launch(q.get('rom'),q.get('name'));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)location.href='library.html?system='+encodeURIComponent(sys.id)})
</script></body></html>
